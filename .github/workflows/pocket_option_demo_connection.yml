name: Pocket Option Demo Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Demo connection check
        env:
          POCKET_OPTION_SSID: ${{ secrets.POCKET_OPTION_SSID }}
        run: python -m tools.pocket_option_demo_connection
