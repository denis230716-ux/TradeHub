name: TradeHub Rolling Validation

on:
  workflow_dispatch:
    inputs:
      horizon:
        description: "Forward candle horizon"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  rolling-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Rolling Validation
        env:
          POCKET_OPTION_SSID: ${{ secrets.POCKET_OPTION_SSID }}
          POCKET_OPTION_ASSET: EURJPY_otc
          POCKET_OPTION_PERIOD: "5"
          POCKET_OPTION_BACKTEST_TIMEOUT: "300"
          POCKET_OPTION_BACKTEST_HORIZON: ${{ inputs.horizon }}
        run: |
          set -o pipefail
          python -m tools.rolling_validation 2>&1 | tee rolling_validation.log

      - name: Upload rolling validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rolling-validation-log-${{ github.run_id }}
          path: rolling_validation.log
          retention-days: 14
