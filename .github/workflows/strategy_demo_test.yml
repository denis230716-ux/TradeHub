name: TradeHub Strategy Demo Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strategy-demo-test:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Strategy Demo Test
        env:
          POCKET_OPTION_SSID: ${{ secrets.POCKET_OPTION_SSID }}
          POCKET_OPTION_ASSET: EURJPY_otc
          POCKET_OPTION_AMOUNT: "1"
          POCKET_OPTION_PERIOD: "5"
          POCKET_OPTION_STRATEGY_TIMEOUT: "21600"
        run: |
          set -o pipefail
          python -m tools.strategy_demo_test 2>&1 | tee strategy_demo_test.log

      - name: Publish test summary
        if: always()
        run: |
          {
            echo "## TradeHub Strategy Demo Test"
            echo '```text'
            tail -n 80 strategy_demo_test.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload strategy demo log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-demo-test-log-${{ github.run_id }}
          path: strategy_demo_test.log
          retention-days: 14
