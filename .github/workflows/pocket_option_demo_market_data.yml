name: Pocket Option Demo Market Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Discover Demo market universe
        env:
          POCKET_OPTION_SSID: ${{ secrets.POCKET_OPTION_SSID }}
        run: python -m tools.pocket_option_demo_universe
