name: Pocket Option Demo Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-demo-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Demo secret
        env:
          POCKET_OPTION_SSID: ${{ secrets.POCKET_OPTION_SSID }}
        run: python -m tools.pocket_option_demo_check
