name: TradeHub Score Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Score Diagnostic
        env:
          POCKET_OPTION_SSID: ${{ secrets.POCKET_OPTION_SSID }}
          POCKET_OPTION_ASSET: EURJPY_otc
          POCKET_OPTION_PERIOD: "5"
          POCKET_OPTION_SCORE_TIMEOUT: "30"
        run: python -m tools.score_diagnostic