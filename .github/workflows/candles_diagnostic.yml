name: TradeHub Candle Diagnostic

on:
  workflow_dispatch:

jobs:
  candles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inspect Pocket Option candles
        env:
          POCKET_OPTION_SSID: ${{ secrets.POCKET_OPTION_SSID }}
          POCKET_OPTION_ASSET: EURJPY_otc
          POCKET_OPTION_CANDLES_TIMEOUT: "20"
        run: python -m tools.candles_diagnostic
